metrics:
- metric_name: financial_message
  verbose_name: ''
  metric_type: null
  expression: "CASE\r\n-- Too early in the month to compare\r\nWHEN MAX(EXTRACT(DAY\
    \ FROM as_of_date)) < 5 THEN\r\n'It is still early in the month. Check back in\
    \ a few days to see how this month compares with last month.'\r\n-- Not enough\
    \ history to compare\r\nWHEN COUNT(CASE WHEN mtd_period = 'previous' THEN 1 END)\
    \ = 0 THEN\r\n'We do not have enough history yet to compare this month with last\
    \ month. Check back soon.'\r\n-- 1. Just turned negative\r\nWHEN SUM(CASE WHEN\
    \ mtd_period = 'current' THEN net_cash_flow ELSE 0 END) < 0\r\n AND SUM(CASE WHEN\
    \ mtd_period = 'previous' THEN net_cash_flow ELSE 0 END) >= 0 THEN\r\n'More money\
    \ went out than came in this month, which is a change from last month. If this\
    \ was a one-time expense, there is nothing to worry about.'\r\n-- 2. Negative,\
    \ and getting worse\r\nWHEN SUM(CASE WHEN mtd_period = 'current' THEN net_cash_flow\
    \ ELSE 0 END) < 0\r\n AND SUM(CASE WHEN mtd_period = 'current' THEN net_cash_flow\
    \ ELSE 0 END)\r\n   < SUM(CASE WHEN mtd_period = 'previous' THEN net_cash_flow\
    \ ELSE 0 END)\r\n     - 0.05 * GREATEST(SUM(CASE WHEN mtd_period = 'previous'\
    \ THEN inflow ELSE 0 END),\r\n                       SUM(CASE WHEN mtd_period\
    \ = 'previous' THEN outflow ELSE 0 END)) THEN\r\n'More money is going out than\
    \ coming in, and the difference is bigger than last month. It may help to look\
    \ at where most of your spending goes.'\r\n-- 3. Negative, but improving\r\nWHEN\
    \ SUM(CASE WHEN mtd_period = 'current' THEN net_cash_flow ELSE 0 END) < 0\r\n\
    \ AND SUM(CASE WHEN mtd_period = 'current' THEN net_cash_flow ELSE 0 END)\r\n\
    \   > SUM(CASE WHEN mtd_period = 'previous' THEN net_cash_flow ELSE 0 END)\r\n\
    \     + 0.05 * GREATEST(SUM(CASE WHEN mtd_period = 'previous' THEN inflow ELSE\
    \ 0 END),\r\n                       SUM(CASE WHEN mtd_period = 'previous' THEN\
    \ outflow ELSE 0 END)) THEN\r\n'More money is still going out than coming in,\
    \ but the difference is smaller than last month. You are moving in the right direction.'\r\
    \n-- 4. Negative, about the same\r\nWHEN SUM(CASE WHEN mtd_period = 'current'\
    \ THEN net_cash_flow ELSE 0 END) < 0 THEN\r\n'More money is going out than coming\
    \ in, about the same as last month. A small change in spending could make a difference\
    \ over time.'\r\n-- 5. Stable\r\nWHEN ABS(SUM(CASE WHEN mtd_period = 'current'\
    \ THEN net_cash_flow ELSE 0 END)\r\n       - SUM(CASE WHEN mtd_period = 'previous'\
    \ THEN net_cash_flow ELSE 0 END))\r\n     <= 0.05 * GREATEST(SUM(CASE WHEN mtd_period\
    \ = 'previous' THEN inflow ELSE 0 END),\r\n                        SUM(CASE WHEN\
    \ mtd_period = 'previous' THEN outflow ELSE 0 END)) THEN\r\n'Your money in and\
    \ out is about the same as last month. A steady month like this is a good time\
    \ to start setting a little aside where it can grow.'\r\n-- 6. Better, spending\
    \ is down\r\nWHEN SUM(CASE WHEN mtd_period = 'current' THEN net_cash_flow ELSE\
    \ 0 END)\r\n   > SUM(CASE WHEN mtd_period = 'previous' THEN net_cash_flow ELSE\
    \ 0 END)\r\n AND SUM(CASE WHEN mtd_period = 'current' THEN outflow ELSE 0 END)\r\
    \n   < SUM(CASE WHEN mtd_period = 'previous' THEN outflow ELSE 0 END) THEN\r\n\
    'You spent less this month, so more of your money is left over than last month.\
    \ Nice work. Money you do not need right away can earn a return if you set it\
    \ aside.'\r\n-- 7. Better, income grew\r\nWHEN SUM(CASE WHEN mtd_period = 'current'\
    \ THEN net_cash_flow ELSE 0 END)\r\n   > SUM(CASE WHEN mtd_period = 'previous'\
    \ THEN net_cash_flow ELSE 0 END) THEN\r\n'More money came in this month, so more\
    \ is left over than last month. You may want to move part of it somewhere it can\
    \ grow, instead of keeping it all in your current account.'\r\n-- 8. Worse, spending\
    \ went up\r\nWHEN SUM(CASE WHEN mtd_period = 'current' THEN outflow ELSE 0 END)\r\
    \n   > SUM(CASE WHEN mtd_period = 'previous' THEN outflow ELSE 0 END) THEN\r\n\
    'You spent more this month than last month, so less of your money is left over.\
    \ Looking at your biggest expenses could show what changed.'\r\n-- 9. Worse, income\
    \ is weaker\r\nELSE\r\n'Less money came in this month than last month, so less\
    \ of your money is left over. It may be temporary. Planning your spending around\
    \ it can help.'\r\nEND"
  description: null
  d3format: null
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: net_pct
  verbose_name: ''
  metric_type: null
  expression: "CASE WHEN SUM(CASE WHEN mtd_period = 'previous' THEN net_cash_flow\
    \ ELSE 0 END) <> 0 THEN\r\n  CASE WHEN SUM(CASE WHEN mtd_period = 'current'  THEN\
    \ net_cash_flow ELSE 0 END)\r\n         >= SUM(CASE WHEN mtd_period = 'previous'\
    \ THEN net_cash_flow ELSE 0 END)\r\n       THEN '+' ELSE '' END\r\n  || TO_CHAR(ROUND(100.0\
    \ * (\r\n       SUM(CASE WHEN mtd_period = 'current'  THEN net_cash_flow ELSE\
    \ 0 END)\r\n     - SUM(CASE WHEN mtd_period = 'previous' THEN net_cash_flow ELSE\
    \ 0 END))\r\n     / ABS(SUM(CASE WHEN mtd_period = 'previous' THEN net_cash_flow\
    \ ELSE 0 END))), 'FM999,990') || '%'\r\nEND"
  description: null
  d3format: null
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: out_pct
  verbose_name: ''
  metric_type: null
  expression: "CASE WHEN SUM(CASE WHEN mtd_period = 'previous' THEN outflow ELSE 0\
    \ END) > 0 THEN\r\n  CASE WHEN SUM(CASE WHEN mtd_period = 'current'  THEN outflow\
    \ ELSE 0 END)\r\n         <= SUM(CASE WHEN mtd_period = 'previous' THEN outflow\
    \ ELSE 0 END)\r\n       THEN '+' ELSE '' END\r\n  || TO_CHAR(ROUND(-100.0 * (\r\
    \n       SUM(CASE WHEN mtd_period = 'current'  THEN outflow ELSE 0 END)\r\n  \
    \   - SUM(CASE WHEN mtd_period = 'previous' THEN outflow ELSE 0 END))\r\n    \
    \ / SUM(CASE WHEN mtd_period = 'previous' THEN outflow ELSE 0 END)), 'FM999,990')\
    \ || '%'\r\nEND"
  description: null
  d3format: null
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
