- metric_name: balance_pct
  verbose_name: ''
  metric_type: null
  expression: "(CASE WHEN SUM(CASE WHEN balance_point = 'current'  THEN balance END)\r\
    \n         - SUM(CASE WHEN balance_point = 'previous' THEN balance END) >= 0\r\
    \n       THEN '+' ELSE '' END)\r\n|| TO_CHAR(ROUND(100.0 *\r\n     (SUM(CASE WHEN\
    \ balance_point = 'current'  THEN balance END)\r\n    - SUM(CASE WHEN balance_point\
    \ = 'previous' THEN balance END))\r\n     / NULLIF(ABS(SUM(CASE WHEN balance_point\
    \ = 'previous' THEN balance END)), 0)), 'FM999990')\r\n|| '%'"
  description: null
