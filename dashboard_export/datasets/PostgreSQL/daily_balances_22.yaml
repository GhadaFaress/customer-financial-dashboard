    \ ELSE 0 END)\r\n         >= SUM(CASE WHEN mtd_period = 'previous' THEN inflow\
    \ ELSE 0 END)\r\n       THEN '+' ELSE '' END\r\n  || TO_CHAR(ROUND(100.0 * (\r\
    \n       SUM(CASE WHEN mtd_period = 'current'  THEN inflow ELSE 0 END)\r\n   \
    \  - SUM(CASE WHEN mtd_period = 'previous' THEN inflow ELSE 0 END))\r\n     /\
